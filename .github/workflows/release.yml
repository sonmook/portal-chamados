name: Publicar versão
on:
  push:
    branches: [main]
    paths:
      - VERSION
      - docs/releases/**
      - .github/workflows/release.yml
      - scripts/plan_releases.py
      - scripts/resolve_release.py
  workflow_dispatch:
    inputs:
      version:
        description: atual, pendentes ou uma versão histórica (exemplo v1.10.0)
        type: string
        required: true
        default: pendentes
permissions:
  contents: read
concurrency:
  group: publicar-versao-main
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.target.outputs.matrix }}
      has_releases: ${{ steps.target.outputs.has_releases }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Planejar versões ainda sem Release
        id: target
        env:
          PORTAL_RELEASE: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/check_release.py
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp --jq 'add' > "$RUNNER_TEMP/releases.json"
          python scripts/plan_releases.py "$RUNNER_TEMP/releases.json" "${PORTAL_RELEASE:-pendentes}" >> "$GITHUB_OUTPUT"
  validation:
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.has_releases == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ matrix.sha }}
  release:
    needs: [prepare, validation]
    if: github.ref == 'refs/heads/main' && needs.prepare.outputs.has_releases == 'true'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ matrix.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Validar versão e vínculo com main
        env:
          PORTAL_VERSION: ${{ matrix.version }}
          PORTAL_SHA: ${{ matrix.sha }}
          PORTAL_LATEST: ${{ matrix.latest }}
        run: |
          set -euo pipefail
          version=$(python scripts/check_release.py)
          test "$version" = "$PORTAL_VERSION"
          test "$(git rev-parse HEAD)" = "$PORTAL_SHA"
          git fetch origin main --tags
          git merge-base --is-ancestor HEAD origin/main || { echo 'O commit não pertence à main.'; exit 1; }
          if test "$PORTAL_LATEST" = true; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'A main avançou. Execute novamente para validar o novo commit.'; exit 1; }
          fi
      - name: Criar tag oficial e release
        env:
          GH_TOKEN: ${{ github.token }}
          PORTAL_TAG: ${{ matrix.tag }}
          PORTAL_LATEST: ${{ matrix.latest }}
          GIT_COMMITTER_NAME: Emerson Franco
          GIT_COMMITTER_EMAIL: 132287925+sonmook@users.noreply.github.com
        run: |
          set -euo pipefail
          tag="$PORTAL_TAG"
          if rg -q '^# Nexaltri' README.md; then
            sistema=Nexaltri
          else
            sistema='Portal de TI'
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            test "$(git rev-list -n 1 "$tag")" = "$(git rev-parse HEAD)" || { echo 'A tag já aponta para outro commit; não será sobrescrita.'; exit 1; }
          else
            git tag -a "$tag" -m "$sistema $tag"
            git push origin "$tag"
          fi
          # Repetir a ação não move tags nem reescreve Releases existentes.
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
          if printf '%s\n' "$releases" | grep -Fxq "$tag"; then
            echo 'Release já publicada.'
          else
            gh release create "$tag" --verify-tag --title "$sistema $tag" --notes-file "docs/releases/$tag.md" --latest="$PORTAL_LATEST"
          fi
