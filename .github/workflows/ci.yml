name: Validação
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip check
      - run: python manage.py check --fail-level WARNING
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 1
      - name: Check de produção e coleta de estáticos
        env:
          DJANGO_SETTINGS_MODULE: core.settings_production
          # Valor público usado somente por esta validação isolada, nunca em implantação.
          DJANGO_SECRET_KEY: ci-validation-only-7dd59e1a-0138-4a95-8794-39431b563aa2
          DJANGO_ALLOWED_HOSTS: portal.example.invalid
          DJANGO_DB_PATH: /tmp/portal-ci.sqlite3
          DJANGO_MEDIA_ROOT: /tmp/portal-ci-private-media
          DJANGO_STATIC_ROOT: /tmp/portal-ci-static
        run: |
          python scripts/check_production.py
          python manage.py collectstatic --noinput
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --require-hashes -r requirements.txt
  homologacao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: HTTPS local e restauração isolada
        env:
          COMPOSE_BAKE: "false"
        run: python scripts/test_homologacao.py
