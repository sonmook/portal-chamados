name: Validação
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit exato a validar na publicação
        required: false
        type: string
        default: ''
  schedule:
    - cron: '0 12 * * 1'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python scripts/check_release.py
      - run: python -m pip check
      - run: python manage.py check --fail-level WARNING
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 1
      - name: Check de produção e coleta de estáticos
        env:
          DJANGO_SETTINGS_MODULE: core.settings_production
          # Valor público usado somente por esta validação isolada, nunca em implantação.
          DJANGO_SECRET_KEY: ci-validation-only-7dd59e1a-0138-4a95-8794-39431b563aa2
          DJANGO_ALLOWED_HOSTS: portal.example.invalid
          DJANGO_DB_PATH: /tmp/portal-ci.sqlite3
          DJANGO_MEDIA_ROOT: /tmp/portal-ci-private-media
          DJANGO_STATIC_ROOT: /tmp/portal-ci-static
        run: |
          python scripts/check_production.py
          python manage.py collectstatic --noinput
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install pip-audit==2.10.1
      - run: python -m pip_audit --require-hashes -r requirements.txt
  homologacao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: HTTPS local e restauração isolada
        env:
          COMPOSE_BAKE: "true"
        run: |
          set -euo pipefail
          # Bake só precisa ler o certificado dentro do contexto permitido.
          build_ca_dir=$(mktemp -d "$GITHUB_WORKSPACE/.build-ca-XXXXXX")
          trap 'rm -rf -- "$build_ca_dir"' EXIT
          cp "${BUILD_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}" "$build_ca_dir/ca.pem"
          chmod 600 "$build_ca_dir/ca.pem"
          # Também protege o checkout histórico, anterior a esta regra de exclusão.
          if ! grep -Fxq '.build-ca-*' .dockerignore; then
            printf '\n.build-ca-*\n' >> .dockerignore
          fi
          BUILD_CA_BUNDLE="$build_ca_dir/ca.pem" python scripts/test_homologacao.py

  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: portal com espacos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          path: portal com espacos
      - name: Verificar suporte ao inicializador nesta revisão
        id: suporte
        shell: pwsh
        run: |
          if (Test-Path 'iniciar-portal.cmd') {
            'habilitado=true' >> $env:GITHUB_OUTPUT
          } else {
            'habilitado=false' >> $env:GITHUB_OUTPUT
            Write-Host 'Revisão histórica anterior ao inicializador; a validação Windows não se aplica.'
          }
      - uses: actions/setup-python@v5
        if: steps.suporte.outputs.habilitado == 'true'
        with:
          python-version-file: portal com espacos/.python-version
      - if: steps.suporte.outputs.habilitado == 'true'
        run: python -m venv .venv
      - if: steps.suporte.outputs.habilitado == 'true'
        run: .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements.txt
      - if: steps.suporte.outputs.habilitado == 'true'
        run: .\.venv\Scripts\python.exe manage.py migrate --noinput
      - if: steps.suporte.outputs.habilitado == 'true'
        run: .\.venv\Scripts\python.exe -m unittest helpdesk.test_iniciar_local -v
      - name: Verificar inicializador chamado de outra pasta
        if: steps.suporte.outputs.habilitado == 'true'
        shell: pwsh
        run: |
          $inicializador = Join-Path $env:GITHUB_WORKSPACE 'portal com espacos\iniciar-portal.cmd'
          Push-Location $env:TEMP
          try {
            & $inicializador --verificar
            if ($LASTEXITCODE -ne 0) { throw 'O inicializador retornou erro.' }
          } finally {
            Pop-Location
          }
