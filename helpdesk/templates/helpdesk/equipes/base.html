<!doctype html>
<html lang="pt-br">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Gerenciar Equipes{% endblock %} — Portal de TI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light pb-5">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4"><div class="container flex-wrap gap-3">
<a class="navbar-brand fw-bold" href="{% url 'lista_chamados' %}">Portal de TI</a>
<div class="d-flex flex-wrap gap-3 me-auto">
<a class="text-white text-decoration-none" href="{% url 'lista_chamados' %}">Chamados</a>
<a class="text-white text-decoration-none" href="{% url 'gerenciar_usuarios' %}">Gerenciar Usuários</a>
<a class="text-warning text-decoration-none" href="{% url 'gerenciar_equipes' %}">Gerenciar Equipes</a></div>
<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-light btn-sm">Sair</button></form>
</div></nav>
<main class="container">
{% for message in messages %}<div class="alert alert-info" role="status">{{ message }}</div>{% endfor %}
{% block conteudo %}{% endblock %}
</main></body></html>
