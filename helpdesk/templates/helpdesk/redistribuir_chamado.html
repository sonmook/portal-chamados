<!doctype html>
<html lang="pt-br">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redistribuir chamado #{{ chamado.pk }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-4" style="max-width: 720px">
<a href="{% url 'detalhes_chamado' chamado.pk %}">Voltar ao chamado</a>
<div class="card mt-3"><div class="card-body">
<h1 class="h4">Redistribuir chamado #{{ chamado.pk }}</h1>
<p>{{ chamado.titulo }}</p>
<p>Responsável atual: <strong>{{ chamado.tecnico.username|default:'Sem responsável' }}</strong></p>
<p>O novo responsável poderá responder e encerrar este chamado. O histórico será preservado.</p>
<form method="post">{% csrf_token %}{{ form.as_p }}
<button class="btn btn-primary" type="submit">Confirmar transferência</button></form>
</div></div></main></body></html>
